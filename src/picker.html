<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>LiveClass</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="page">
    <div class="head">
      <h1 id="title"></h1>
      <div class="tabs">
        <button type="button" class="tab active" data-tab="screen" id="tab-screen"></button>
        <button type="button" class="tab" data-tab="window" id="tab-window"></button>
      </div>
    </div>
    <p class="note" id="note" hidden></p>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <label id="sound-row" hidden><input type="checkbox" id="sound"> <span id="sound-label"></span></label>
      <span class="hint" id="hint"></span>
      <span class="spacer"></span>
      <button type="button" class="btn" id="cancel"></button>
      <button type="button" class="btn primary" id="share" disabled></button>
    </div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
